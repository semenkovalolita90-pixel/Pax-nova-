function renderChat(){$("am").innerHTML=chat.map(c=>`<div class="m ${c.r}">${esc(c.t).replace(/«([^»]{3,140})»/g,(_,t)=>`<button class="sm ins" data-t="${t}">«${t}»</button>`).replace(/\n/g,"<br>")}</div>`).join("")||'<span class="mu">Спросите совет или попросите сводку игры. Приказы из ответов можно вставить в поле одним нажатием.</span>';$("am").scrollTop=1e6}
function adCtx(){const A=adj(),k=K,tot=k.reduce((a,b)=>a+b,0),sh=i=>pc(k[i],tot)+"%",rank=N.filter(n=>k[n.i]>k[me]).length+1;
 const nb=[...A[me]].sort((a,b)=>k[b]-k[a]).slice(0,8).map(j=>N[j].name+" "+sh(j)).join(", ")||"нет сухопутных соседей";
 const top=N.filter(n=>k[n.i]).sort((a,b)=>k[b.i]-k[a.i]).slice(0,6).map(n=>n.name+" "+sh(n.i)).join(", ");
 const full=log.slice().reverse().map(e=>`${e.d}: ${e.h}. ${e.s} ${e.tr.join("; ")}`.slice(0,320)).join("\n")||"(ходов ещё не было) "+scn.brief;
 return `Сюжет: «${scn.t}». ${scn.ctx} Сейчас: ${dateStr()}. Игрок управляет страной «${N[me].name}»: ${sh(me)} суши (в начале игры ${share0.toFixed(1)}%), ${rank}-е место по территории. Соседи: ${nb}. Крупнейшие державы: ${top}.\nХронология игры:\n${full}`}
function offAdv(kind){const A=adj(),k=K,tot=k.reduce((a,b)=>a+b,0),nb=[...A[me]].sort((a,b)=>k[b]-k[a]);
 if(kind==="sum")return log.length?`ИИ недоступен, вот краткая сводка. Ходов: ${log.length}. Доля суши: было ${share0.toFixed(1)}%, стало ${pc(k[me],tot)}%.\n`+log.slice().reverse().map(e=>`${e.d}: ${e.h}`).join("\n"):"Ходов ещё не было — сводить пока нечего.";
 if(kind==="ask")return "ИИ сейчас недоступен, поэтому на свободные вопросы я не отвечаю. Нажмите «Что делать?» — дам базовый совет.";
 if(!nb.length)return "У вас нет сухопутных соседей — действуйте через дипломатию и торговлю.";
 const s=N[nb[0]].name,w=N[nb[nb.length-1]].name,t=N[nb[Math.min(1,nb.length-1)]].name;
 return `ИИ недоступен, базовый совет: у вас ${pc(k[me],tot)}% суши. Сильнейший сосед — ${s}, слабейший — ${w}.\n1. Безопасность: «Предложить союз: ${s}»\n2. Экономика: «Торговое соглашение: ${t}»\n3. Давление: «Ввести санкции: ${w}»`}
async function adv(kind,q){if(busy||me==null)return;busy=true;
 chat.push({r:"u",t:kind==="tip"?"Что мне делать?":kind==="sum"?"Дай сводку игры за всё время":q},{r:"a",t:"Советник думает…"});renderChat();
 const ins=kind==="tip"?"Оцени положение страны игрока и дай ровно 3 конкретных совета. К каждому — готовый приказ в кавычках «…», который игрок может вставить в поле приказов. До 130 слов.":kind==="sum"?"Сделай сводку всей игры за всё время: хронология по ходам (сжато), как изменилась территория игрока, кто из держав усилился или ослаб, главные риски дальше. До 200 слов.":"Ответь на вопрос игрока как советник, опираясь на положение дел. До 130 слов. Вопрос: "+q;
 let txt=null;try{if(ai){const res=await ai(`Ты — личный советник правителя в игре альтернативной истории. Отвечай по-русски, без вступлений.\n${adCtx()}\n\n${ins}`,{cache:false});txt=String(res.text||"").trim()||null}}catch(e){}
 chat.pop();chat.push({r:"a",t:txt||offAdv(kind)});busy=false;renderChat()}
$("a1").onclick=()=>adv("tip");$("a2").onclick=()=>adv("sum");
const ask2=()=>{const q=$("aq").value.trim();if(q){$("aq").value="";adv("ask",q)}};$("as").onclick=ask2;$("aq").onkeydown=e=>{if(e.key==="Enter")ask2()};

$("q").oninput=render;$("lh").onclick=()=>{$("lb").hidden=!$("lb").hidden;render()};

function offline(mo){const A=adj(),k=cnt(),live=N.filter(n=>k[n.i]&&A[n.i].size),ev=[],transfers=[],R=a=>a[Math.random()*a.length|0];
 for(let t=0;t<Math.max(1,mo/3|0)+1;t++){const a=R(live),b=N[R([...A[a.i]])];
  if(Math.random()<.5){const w=Math.random()<k[a.i]/(k[a.i]+k[b.i])?[a,b]:[b,a];transfers.push({from:w[1].name,to:w[0].name,share:3+Math.random()*12|0,why:"приграничный конфликт"});ev.push(`${w[0].name} берёт верх над ${w[1].name} в приграничных боях`)}
  else ev.push(`${a.name} и ${b.name} подписывают торговое соглашение`)}
 return{headline:"Дипломатия и пограничные стычки",summary:"Мир живёт своей жизнью: державы проверяют друг друга на прочность.",events:ev,transfers}}
async function ask(mo,ord){const A=adj(),k=cnt();
 const world=N.filter(n=>k[n.i]).sort((a,b)=>k[b.i]-k[a.i]).map(n=>`${n.name}: ${pc(k[n.i],k.reduce((a,b)=>a+b,0))}% суши; соседи: ${[...A[n.i]].slice(0,5).map(j=>N[j].name).join(", ")}`).join("\n");
 const res=await ai(`Ты — движок игры в альтернативную историю (как Pax Historia). Отвечай по-русски.
Сюжет: «${scn.t}». ${scn.ctx}
Сейчас: ${dateStr()}. Игрок управляет страной «${N[me].name}». Ход длится ${mo} мес.
Приказы игрока:
${ord||"(нет приказов)"}

Карта мира (страна: доля суши; соседи):
${world}

Недавняя история:
${hist.slice(-6).join("\n")||"(начало игры) "+scn.brief}

Смоделируй ход реалистично и драматично: другие страны действуют сами в своих интересах, возможны войны, союзы, перевороты, кризисы. Успех приказов зависит от силы и правдоподобия, игрок не всемогущ. Не выдумывай страны, которых нет в списке. Соответствуй эпохе сюжета: технологии, лидеры, реальные предпосылки.
Верни ТОЛЬКО JSON без пояснений и без markdown:
{"headline":"короткий заголовок","summary":"3-4 предложения о главном","events":["2-4 коротких события"],"transfers":[{"from":"страна-проигравший","to":"страна-получатель","share":10,"why":"причина"}]}
transfers — только реальные изменения границ (завоевание, отделение, присоединение), от 0 до 4. share — какая доля территории страны from в процентах (1–100; 100 — полная аннексия) переходит к to; обычно 3–30. Имена строго из списка.`,{cache:false});
 const t=res.text||"";return JSON.parse(t.slice(t.indexOf("{"),t.lastIndexOf("}")+1))}
$("go").onclick=async function(){
 const b=this,mo=+$("per").value,ord=$("ord").value.trim();b.disabled=true;b.textContent="Мир живёт…";
 let r=null,note="";
 if(ai){try{r=await ask(mo,ord)}catch(e){note=e&&e.code==="rate_limited"?"Лимит запросов ИИ — ход просчитан упрощённо.":"ИИ не ответил — ход просчитан упрощённо.";if(e&&e.code==="not_granted"){ai=null;st()}}}
 if(!r){r=offline(mo);if(!ai&&!note)note="ИИ выключен — упрощённая симуляция, приказы не учитываются."}
 const tr=applyTr(r.transfers),e={d:dateStr(),h:String(r.headline||"Итоги хода"),s:String(r.summary||"")+(note?" ["+note+"]":""),ev:(Array.isArray(r.events)?r.events:[]).slice(0,5).map(String),tr};
 m+=mo;y+=Math.floor(m/12);m%=12;
 log.unshift(e);hist.push((e.d+": "+e.h+". "+e.s).slice(0,300));
 $("ord").value="";b.disabled=false;b.textContent="Завершить ход";render()};
